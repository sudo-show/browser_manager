[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "browser_manager"
version = "0.1.0"
description = "Async Playwright browser lifecycle helper"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
]

[tool.setuptools.packages.find]
include = ["browser_manager*"]